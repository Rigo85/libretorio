# Include inside the Libretorio HTTPS server BEFORE regex locations by extension.
# The backend authenticates every request; Nginx must not make it public again.
location ~ ^/(?:books|cache|covers|temp_covers|home/rigo/Libretorio-Scanner/dist/public/books)(?:/|$) {
    proxy_pass http://10.10.0.2:3005;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_cache off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    expires off;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "private, no-store" always;
}
